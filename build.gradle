apply plugin: 'java'
apply plugin: 'application'

group = 'com.quiver'
version = '0.1.0'

application {
    mainClass = 'com.quiver.Main'
}

// sourceCompatibility/targetCompatibility go through this Gradle version's own
// JavaVersion parsing, which predates Java 25 and mishandles it. Passing --release
// straight to javac sidesteps that entirely and is what actually controls the language
// level the compiler accepts.
[compileJava, compileTestJava].each {
    it.options.compilerArgs << '--release' << '25'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.1'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.10.1'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.9.1'
}

test {
    useJUnitPlatform()
}

// The application plugin's distribution tasks bundle runtime dependencies and provide
// launch scripts, so no shadow/fat-jar plugin is needed.
jar {
    manifest {
        attributes 'Main-Class': 'com.quiver.Main'
    }
}

tasks.register('createCliStartScripts', org.gradle.jvm.application.tasks.CreateStartScripts) {
    applicationName = 'quiver-cli'
    mainClass = 'com.quiver.cli.Main'
    classpath = files(tasks.jar.archiveFile, configurations.runtimeClasspath)
    outputDir = layout.buildDirectory.dir('cli-scripts').get().asFile
}

distributions {
    main {
        contents {
            from(tasks.named('createCliStartScripts')) {
                into 'bin'
            }
        }
    }
}
